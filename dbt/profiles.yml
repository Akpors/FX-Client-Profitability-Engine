fxengine:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('FX_DB_HOST') }}"
      port: "{{ env_var('FX_DB_PORT') | as_number }}"
      user: "{{ env_var('FX_DB_USER') }}"
      password: "{{ env_var('FX_DB_PASSWORD') }}"
      dbname: "{{ env_var('FX_DB_NAME') }}"
      schema: public
      threads: 4
