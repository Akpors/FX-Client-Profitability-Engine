          - {segment: payment_institution, currency_pair: EURUSD, trade_month: '2025-03-01', notional_eur: 1000000, gross_pnl_eur: 0}
          - {segment: payment_institution, currency_pair: EURUSD, trade_month: '2025-04-01', notional_eur: 1000000, gross_pnl_eur: 0}
          - {segment: payment_institution, currency_pair: EURUSD, trade_month: '2025-05-01', notional_eur: 1000000, gross_pnl_eur: 0}
