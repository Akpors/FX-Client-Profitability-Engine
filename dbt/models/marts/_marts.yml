          - {segment: hedge_fund, currency_pair: EURGBP, trade_month: '2025-05-01', notional_eur: 1000000, gross_pnl_eur: -500}
          - {segment: hedge_fund, currency_pair: EURGBP, trade_month: '2025-06-01', notional_eur: 1000000, gross_pnl_eur: -600}
    expect:
      format: dict
      rows:
        - {segment: sme, currency_pair: EURUSD, month: '2025-01-01', month_index: 0, n_months: 6, volume_eur: 4000000, gross_margin_bps: 10, compression_slope_bps_per_year: -12, compression_pct_per_year: -175.6098}
        - {segment: sme, currency_pair: EURUSD, month: '2025-02-01', month_index: 1, n_months: 6, volume_eur: 1000000, gross_margin_bps: 9, compression_slope_bps_per_year: -12, compression_pct_per_year: -175.6098}
        - {segment: sme, currency_pair: EURUSD, month: '2025-04-01', month_index: 3, n_months: 6, volume_eur: 1000000, gross_margin_bps: 7, compression_slope_bps_per_year: -12, compression_pct_per_year: -175.6098}
