          - {segment: sme, currency_pair: EURUSD, trade_month: '2025-07-01', notional_eur: 1000000, gross_pnl_eur: 400}
          - {segment: hedge_fund, currency_pair: EURUSD, trade_month: '2025-01-01', notional_eur: 1000000, gross_pnl_eur: 300}
          - {segment: hedge_fund, currency_pair: EURUSD, trade_month: '2025-02-01', notional_eur: 1000000, gross_pnl_eur: 300}
          - {segment: hedge_fund, currency_pair: EURUSD, trade_month: '2025-03-01', notional_eur: 1000000, gross_pnl_eur: 300}
          - {segment: hedge_fund, currency_pair: EURUSD, trade_month: '2025-04-01', notional_eur: 1000000, gross_pnl_eur: 300}
          - {segment: hedge_fund, currency_pair: EURUSD, trade_month: '2025-05-01', notional_eur: 1000000, gross_pnl_eur: 300}
          - {segment: hedge_fund, currency_pair: EURUSD, trade_month: '2025-06-01', notional_eur: 1000000, gross_pnl_eur: 300}
          - {segment: sme, currency_pair: EURGBP, trade_month: '2025-01-01', notional_eur: 1000000, gross_pnl_eur: 800}
          - {segment: sme, currency_pair: EURGBP, trade_month: '2025-02-01', notional_eur: 1000000, gross_pnl_eur: 800}
          - {segment: sme, currency_pair: EURGBP, trade_month: '2025-03-01', notional_eur: 1000000, gross_pnl_eur: 800}
