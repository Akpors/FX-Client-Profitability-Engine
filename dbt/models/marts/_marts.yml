version: 2

# The marts are what the dashboard, the pricing engine and the notebooks read. Formulas, grains
# and the desk reading of every column: docs/methodology/metrics.md, sections 2 to 4.
models:
  - name: fct_trades
    description: >
      The trade fact table: int_trades_enriched materialised in the marts schema, one row per
      trade with its economics (gross P&L, margin, benchmark spread, cover slippage, ops cost
      and capital charge). Formulas: metrics.md section 1.
    columns:
      - name: trade_id
        data_tests: [unique, not_null]
      - name: client_id
        data_tests: [not_null]
      - name: notional_eur
        data_tests: [not_null]
      - name: gross_pnl_eur
        data_tests: [not_null]

  - name: fct_trades_brief_view
    description: >
      The trade table in the exact column layout of the original brief, as a view on fct_trades.
      buy_rate and sell_rate are the dealer's two legs: on a client BUY of EUR the dealer buys
      EUR in the market at cover_rate and sells it to the client at client_rate; on a client
      SELL it buys from the client at client_rate and sells in the market at cover_rate. So
      (sell_rate − buy_rate) × volume is always the dealer's quote-currency P&L, and pnl is that
      amount in EUR. client is the client name; client_id is on fct_trades.
    columns:
      - name: client
        description: Client name (a code such as `Client LC-014`).
        data_tests: [not_null]
      - name: trade
        description: Trade ID.
        data_tests: [unique, not_null]
      - name: buy_rate
        description: Rate at which the dealer bought EUR (cover on a client BUY, client rate on a client SELL).
        data_tests: [not_null]
      - name: sell_rate
        description: Rate at which the dealer sold EUR (client rate on a client BUY, cover on a client SELL).
        data_tests: [not_null]
      - name: benchmark_rate
        description: Same-day ECB reference rate, quote currency per 1 EUR.
      - name: volume
        description: Notional in EUR.
      - name: timestamp
        description: Trade timestamp (trade_ts).
      - name: pnl
        description: Dealer gross P&L in EUR (gross_pnl_eur).

  - name: dim_clients
    description: >
      One row per client in the book: the client attributes from the generator plus the first
      and last trade dates in the window (NULL for a client that has not traded).
    columns:
      - name: client_id
        data_tests: [unique, not_null]
      - name: client_name
        data_tests: [not_null]
      - name: segment
        data_tests: [not_null]

  - name: mart_client_profitability
    description: >
      One row per client in stg_clients over the full window: volume, gross spread, costs,
      economic contribution and margins, the per-trade contribution distribution, ticket size,
      shares of the book, execution quality and the peer benchmark. Clients with no trades in
      the window have zero amounts and NULL margins and per-trade figures. Metrics 1-7, 9, 10;
      see metrics.md section 3.
    columns:
      - name: client_id
        data_tests: [unique, not_null]
      - name: client_name
        data_tests: [not_null]
      - name: segment
        data_tests: [not_null]
      - name: trade_count
        data_tests: [not_null]
      - name: volume_eur
        data_tests: [not_null]
      - name: revenue_eur
        data_tests: [not_null]
      - name: ops_cost_eur
        data_tests: [not_null]
      - name: capital_charge_eur
        data_tests: [not_null]
      - name: coverage_cost_eur
        data_tests: [not_null]
      - name: economic_contribution_eur
        data_tests: [not_null]
      - name: volume_share
        data_tests: [not_null]
      - name: revenue_share
        data_tests: [not_null]
      - name: contribution_share
        description: Can be negative (a client whose costs exceed its revenue).
        data_tests: [not_null]
      - name: share_gap
        description: volume_share − contribution_share; positive means the client brings more volume than contribution.
        data_tests: [not_null]
      - name: gross_margin_bps
        description: revenue_eur / volume_eur × 10,000; NULL for a client with no volume.
      - name: economic_margin_bps
        description: economic_contribution_eur / volume_eur × 10,000; NULL for a client with no volume.
      - name: peer_median_gross_margin_bps
        description: Median gross_margin_bps of clients with the same segment and modal_ticket_band, the client included.
      - name: peer_group_size
        description: Number of clients in that peer group; 1 means the benchmark is the client's own margin.

  - name: mart_currency_profitability
    description: >
      One row per currency pair in the pair reference: volume, gross spread, benchmark spread,
      cover slippage, per-trade costs and contribution excluding coverage. Coverage cost is a
      client-relationship cost with no currency, so it is not allocated here (metrics.md
      section 4). Metrics 1-3, 5, 10.
    columns:
      - name: currency_pair
        data_tests: [unique, not_null]
      - name: trade_count
        data_tests: [not_null]
      - name: volume_eur
        data_tests: [not_null]
      - name: revenue_eur
        data_tests: [not_null]
      - name: ops_cost_eur
        data_tests: [not_null]
      - name: capital_charge_eur
        data_tests: [not_null]
      - name: contribution_ex_coverage_eur
        data_tests: [not_null]

  - name: mart_concentration
    description: >
      Client concentration (metric 8): one row per measure. volume is over every client with
      trades, revenue over clients with positive revenue, contribution_positive over clients
      with positive economic contribution. Shares are within the measure's own population;
      topN_share is the sum of the N largest shares; hhi is the sum of squared shares on a 0-1
      scale (not the 0-10,000 scale of antitrust practice); n_clients is the population size.
      A measure with an empty population has no row. See metrics.md section 6.
    data_tests:
      - unique:
          column_name: measure
    columns:
      - name: measure
        data_tests:
          - not_null
          - accepted_values:
              values: ['volume', 'revenue', 'contribution_positive']
      - name: n_clients
        description: Number of clients in the measure's population.
        data_tests: [not_null]
      - name: top5_share
        description: Share of the measure held by the 5 largest clients (1 when the population has 5 or fewer).
        data_tests: [not_null]
      - name: top10_share
        data_tests: [not_null]
      - name: top20_share
        data_tests: [not_null]
      - name: hhi
        description: Sum of squared shares, 0-1 scale. Bounds 1 / n_clients to 1 (assert_hhi_bounds).
        data_tests: [not_null]

  - name: mart_client_monthly
    description: >
      Client profitability trends (metric 12): int_client_month with the client's name, the
      month index, margins in bps, a rolling 3-month contribution, the trend slope of monthly
      contribution and a trend flag. One row per client per month on the book, zero-trade months
      included. See metrics.md section 8.
    data_tests:
      - unique:
          column_name: "client_id || '|' || month"
    columns:
      - name: client_id
        data_tests: [not_null]
      - name: client_name
        data_tests: [not_null]
      - name: segment
        data_tests: [not_null]
      - name: month
        description: First day of the calendar month.
        data_tests: [not_null]
      - name: month_index
        description: Whole months since the window start (0 for the first window month). A client onboarded mid-window starts at its onboarding month, not at 0.
        data_tests: [not_null]
      - name: gross_margin_bps
        description: revenue_eur / volume_eur x 10,000; NULL for a month with no volume.
      - name: economic_margin_bps
        description: economic_contribution_eur / volume_eur x 10,000; NULL for a month with no volume.
      - name: contribution_rolling_3m_eur
        description: SUM (not a mean) of economic contribution over the current and the 2 prior months; NULL until the client has 3 months of history.
      - name: trend_slope_eur_per_month
        description: Least-squares slope of monthly contribution on month_index, per client, repeated on each of its rows. NULL for a client with a single month.
      - name: trend_flag
        description: stable when |slope| < 0.05 x the client's mean monthly |contribution| (or the slope is NULL); otherwise improving (slope > 0) or deteriorating (slope < 0).
        data_tests:
          - not_null
          - accepted_values:
              values: ['improving', 'stable', 'deteriorating']

  - name: mart_spread_compression
    description: >
      Spread compression (metric 11): realised gross margin in bps by month, segment and currency
      pair, for months that have trades, with the trend slope per segment x pair in bps per year
      and as a percentage of the cell's mean margin (negative means the margin is compressing).
      Only combinations with trades in at least 6 distinct months are kept, so the slope is always
      defined. See metrics.md section 7.
    data_tests:
      - unique:
          column_name: "month || '|' || segment || '|' || currency_pair"
    columns:
      - name: month
        description: First day of the calendar month.
        data_tests: [not_null]
      - name: segment
        data_tests: [not_null]
      - name: currency_pair
        data_tests: [not_null]
      - name: month_index
        description: Whole months since the window start.
        data_tests: [not_null]
      - name: n_months
        description: Months with trades for this segment x pair; at least 6 by construction.
        data_tests: [not_null]
      - name: volume_eur
        data_tests: [not_null]
      - name: gross_margin_bps
        description: Σ gross_pnl_eur / Σ notional_eur x 10,000 over the cell's trades (never an average of trade-level bps).
        data_tests: [not_null]
      - name: compression_slope_bps_per_year
        description: Ordinary least-squares slope of gross_margin_bps on month_index, x 12, repeated on each row of the segment x pair.
        data_tests: [not_null]
      - name: compression_pct_per_year
        description: >
          The relative rate of margin decline, % a year - compression_slope_bps_per_year divided by
          the absolute mean of the segment x pair's monthly gross_margin_bps, x 100, repeated on
          each row. Negative means compressing. Comparable across segments whose margins differ
          by orders of magnitude, unlike the bps slope. NULL when the mean margin is exactly 0, and
          unstable when it is close to 0, so no not_null test.

  - name: mart_headline_kpis
    description: >
      The headline numbers of the book over the window, one row: total volume, revenue and
      economic contribution, gross and economic margin in bps, the number of clients that traded,
      the trade count, the window dates and the hurdle rate. See metrics.md section 9.
    columns:
      - name: total_volume_eur
        data_tests: [not_null]
      - name: total_revenue_eur
        data_tests: [not_null]
      - name: total_contribution_eur
        description: Σ client economic contribution, so it includes coverage cost of clients with no trades.
        data_tests: [not_null]
      - name: gross_margin_bps
        data_tests: [not_null]
      - name: economic_margin_bps
        data_tests: [not_null]
      - name: client_count
        description: Clients with at least one trade in the window.
        data_tests: [not_null]
      - name: trade_count
        data_tests: [not_null]
      - name: window_start
        data_tests: [not_null]
      - name: window_end
        data_tests: [not_null]
      - name: hurdle_rate_bps
        description: Minimum acceptable economic margin in bps of volume, read from the parameters by name.
        data_tests: [not_null]

unit_tests:
  # The brief's layout puts the dealer's two legs side by side. Both trades are the EURUSD
  # examples of metrics.md section 1.7: the dealer earns 0.0010 USD per EUR either way, so
  # sell_rate − buy_rate is +0.0010 on both rows. A client BUY: the dealer buys EUR in the market
  # at the cover (1.1000) and sells it to the client (1.1010). A client SELL: the dealer buys
  # from the client (1.0990) and sells in the market at the cover (1.1000).
  - name: fct_trades_brief_view_maps_legs_by_side
    model: fct_trades_brief_view
    given:
      - input: ref('fct_trades')
        format: dict
        rows:
          - {trade_id: T-BUY, client_id: C-1, trade_ts: '2025-03-14 10:15:00+00', currency_pair: EURUSD, client_side: BUY, notional_eur: 1000000, client_rate: 1.1010, cover_rate: 1.1000, benchmark_rate: 1.1000, gross_pnl_eur: 909.090909}
          - {trade_id: T-SELL, client_id: C-1, trade_ts: '2025-03-14 11:30:00+00', currency_pair: EURUSD, client_side: SELL, notional_eur: 1000000, client_rate: 1.0990, cover_rate: 1.1000, benchmark_rate: 1.1000, gross_pnl_eur: 909.090909}
      - input: ref('dim_clients')
        format: dict
        rows:
          - {client_id: C-1, client_name: Client MM-001}
    expect:
      format: dict
      rows:
        - {client: Client MM-001, trade: T-BUY, currency_pair: EURUSD, buy_rate: 1.1000, sell_rate: 1.1010, benchmark_rate: 1.1000, volume: 1000000, timestamp: '2025-03-14 10:15:00+00', pnl: 909.0909}
        - {client: Client MM-001, trade: T-SELL, currency_pair: EURUSD, buy_rate: 1.0990, sell_rate: 1.1000, benchmark_rate: 1.1000, volume: 1000000, timestamp: '2025-03-14 11:30:00+00', pnl: 909.0909}

  # Three mid-market clients, hand-checkable (metrics.md section 3.11).
  # A: two trades, one per band, so the modal band is a 1-1 tie, broken by volume: 100k-500k.
  #    Revenue 500 on EUR 250k = 20 bps; contribution 500 − 20 − 2 − 100 = 378 = 15.12 bps.
  #    Per trade, coverage 100 / 2 = 50 each: 300 − 10 − 1 − 50 = 239 and 200 − 10 − 1 − 50 = 139,
  #    so median 189, P10 149, P90 229. Volume-weighted benchmark spread (2 × 200k + 4 × 50k) / 250k = 2.4.
  # B: one 100k-500k trade, 10 bps. Peer median of A and B (same segment and band) = 15 bps.
  # C: onboarded after the window: no months, no trades. Zero amounts, NULL margins and peers.
  # Contribution share: A 378 / 367.5 = 1.0286, B −10.5 / 367.5 = −0.0286. A negative share,
  # and a share above 1, from the same book.
  - name: mart_client_profitability_core_metrics
    model: mart_client_profitability
    given:
      - input: ref('dim_clients')
        format: dict
        rows:
          - {client_id: A, client_name: Client A, segment: mid_market}
          - {client_id: B, client_name: Client B, segment: mid_market}
          - {client_id: C, client_name: Client C, segment: mid_market}
      - input: ref('int_client_month')
        format: dict
        rows:
          - {client_id: A, trade_count: 2, volume_eur: 250000, revenue_eur: 500, ops_cost_eur: 20, capital_charge_eur: 2, coverage_cost_eur: 100, economic_contribution_eur: 378}
          - {client_id: B, trade_count: 1, volume_eur: 100000, revenue_eur: 100, ops_cost_eur: 10, capital_charge_eur: 0.5, coverage_cost_eur: 100, economic_contribution_eur: -10.5}
      - input: ref('fct_trades')
        format: dict
        rows:
          - {client_id: A, notional_eur: 200000, ticket_band: 100k-500k, gross_pnl_eur: 300, ops_cost_eur: 10, capital_charge_eur: 1, benchmark_spread_bps: 2, cover_slippage_bps: 0.1}
          - {client_id: A, notional_eur: 50000, ticket_band: 25k-100k, gross_pnl_eur: 200, ops_cost_eur: 10, capital_charge_eur: 1, benchmark_spread_bps: 4, cover_slippage_bps: 0.6}
          - {client_id: B, notional_eur: 100000, ticket_band: 100k-500k, gross_pnl_eur: 100, ops_cost_eur: 10, capital_charge_eur: 0.5, benchmark_spread_bps: 1, cover_slippage_bps: 0}
      - input: ref('stg_ticket_bands')
        format: dict
        rows:
          - {label: 25k-100k, min_ticket_eur: 25000}
          - {label: 100k-500k, min_ticket_eur: 100000}
    expect:
      format: dict
      rows:
        - {client_id: A, trade_count: 2, volume_eur: 250000, gross_margin_bps: 20, economic_contribution_eur: 378, economic_margin_bps: 15.12, contribution_per_trade_eur: 189, p10_contribution_per_trade_eur: 149, median_contribution_per_trade_eur: 189, p90_contribution_per_trade_eur: 229, avg_ticket_eur: 125000, median_ticket_eur: 125000, modal_ticket_band: 100k-500k, avg_benchmark_spread_bps: 2.4, avg_cover_slippage_bps: 0.2, volume_share: 0.7143, revenue_share: 0.8333, contribution_share: 1.0286, share_gap: -0.3143, peer_median_gross_margin_bps: 15, peer_group_size: 2}
        - {client_id: B, trade_count: 1, volume_eur: 100000, gross_margin_bps: 10, economic_contribution_eur: -10.5, economic_margin_bps: -1.05, contribution_per_trade_eur: -10.5, p10_contribution_per_trade_eur: -10.5, median_contribution_per_trade_eur: -10.5, p90_contribution_per_trade_eur: -10.5, avg_ticket_eur: 100000, median_ticket_eur: 100000, modal_ticket_band: 100k-500k, avg_benchmark_spread_bps: 1, avg_cover_slippage_bps: 0, volume_share: 0.2857, revenue_share: 0.1667, contribution_share: -0.0286, share_gap: 0.3143, peer_median_gross_margin_bps: 15, peer_group_size: 2}
        - {client_id: C, trade_count: 0, volume_eur: 0, gross_margin_bps: null, economic_contribution_eur: 0, economic_margin_bps: null, contribution_per_trade_eur: null, p10_contribution_per_trade_eur: null, median_contribution_per_trade_eur: null, p90_contribution_per_trade_eur: null, avg_ticket_eur: null, median_ticket_eur: null, modal_ticket_band: null, avg_benchmark_spread_bps: null, avg_cover_slippage_bps: null, volume_share: 0, revenue_share: 0, contribution_share: 0, share_gap: 0, peer_median_gross_margin_bps: null, peer_group_size: null}

  # Metric 12, the brief's example. Contributions of 100, 200 and 300 over three consecutive
  # months give a slope of exactly 100 EUR per month. The mean monthly |contribution| is 200, so
  # the "stable" band is |slope| < 10, and 100 is far outside it: improving. Volume is EUR 1m a
  # month, so the margins are easy to check: 150 / 1,000,000 x 10,000 = 1.5 bps gross and
  # 100 / 1,000,000 x 10,000 = 1.0 bps economic. The rolling 3-month figure is a sum, and is NULL
  # until the client has three months of history: 100 + 200 + 300 = 600 in March only.
  - name: mart_client_monthly_improving_trend
    model: mart_client_monthly
    given:
      - input: ref('int_window')
        format: dict
        rows:
          - {window_start: '2025-01-01', window_end: '2025-03-31'}
      - input: ref('dim_clients')
        format: dict
        rows:
          - {client_id: C-1, client_name: Client MM-001}
      - input: ref('int_client_month')
        format: dict
        rows:
          - {client_id: C-1, month: '2025-01-01', segment: mid_market, volume_eur: 1000000, revenue_eur: 150, economic_contribution_eur: 100}
          - {client_id: C-1, month: '2025-02-01', segment: mid_market, volume_eur: 1000000, revenue_eur: 250, economic_contribution_eur: 200}
          - {client_id: C-1, month: '2025-03-01', segment: mid_market, volume_eur: 1000000, revenue_eur: 350, economic_contribution_eur: 300}
    expect:
      format: dict
      rows:
        - {client_id: C-1, client_name: Client MM-001, segment: mid_market, month: '2025-01-01', month_index: 0, gross_margin_bps: 1.5, economic_margin_bps: 1.0, contribution_rolling_3m_eur: null, trend_slope_eur_per_month: 100, trend_flag: improving}
        - {client_id: C-1, client_name: Client MM-001, segment: mid_market, month: '2025-02-01', month_index: 1, gross_margin_bps: 2.5, economic_margin_bps: 2.0, contribution_rolling_3m_eur: null, trend_slope_eur_per_month: 100, trend_flag: improving}
        - {client_id: C-1, client_name: Client MM-001, segment: mid_market, month: '2025-03-01', month_index: 2, gross_margin_bps: 3.5, economic_margin_bps: 3.0, contribution_rolling_3m_eur: 600, trend_slope_eur_per_month: 100, trend_flag: improving}

  # The other flag branches and the edge cases, on a window of Jan-Mar 2025.
  #  B: 300, 200, 100 = slope -100, mean |c| 200, band 10: deteriorating.
  #  C: 100, 101, 99 = slope -0.5, mean |c| 100, band 5: stable (a real but negligible drift).
  #  D: one month only. The slope is NULL (one point has no slope), so it is flagged stable.
  #  E: onboarded in February, so its first row has month_index 1, not 0. February had no trades
  #     (zero volume, so NULL margins, and the coverage cost makes the month -100); March earned
  #     300 on EUR 1m for +200: slope 300, mean |c| 150, band 7.5: improving. Two months of
  #     history, so no rolling 3-month figure.
  - name: mart_client_monthly_flags_and_edge_cases
    model: mart_client_monthly
    given:
      - input: ref('int_window')
        format: dict
        rows:
          - {window_start: '2025-01-01', window_end: '2025-03-31'}
      - input: ref('dim_clients')
        format: dict
        rows:
          - {client_id: B, client_name: Client B}
          - {client_id: C, client_name: Client C}
          - {client_id: D, client_name: Client D}
          - {client_id: E, client_name: Client E}
      - input: ref('int_client_month')
        format: dict
        rows:
          - {client_id: B, month: '2025-01-01', segment: mid_market, volume_eur: 1000000, revenue_eur: 350, economic_contribution_eur: 300}
          - {client_id: B, month: '2025-02-01', segment: mid_market, volume_eur: 1000000, revenue_eur: 250, economic_contribution_eur: 200}
          - {client_id: B, month: '2025-03-01', segment: mid_market, volume_eur: 1000000, revenue_eur: 150, economic_contribution_eur: 100}
          - {client_id: C, month: '2025-01-01', segment: mid_market, volume_eur: 1000000, revenue_eur: 150, economic_contribution_eur: 100}
          - {client_id: C, month: '2025-02-01', segment: mid_market, volume_eur: 1000000, revenue_eur: 151, economic_contribution_eur: 101}
          - {client_id: C, month: '2025-03-01', segment: mid_market, volume_eur: 1000000, revenue_eur: 149, economic_contribution_eur: 99}
          - {client_id: D, month: '2025-03-01', segment: sme, volume_eur: 1000000, revenue_eur: 100, economic_contribution_eur: 50}
          - {client_id: E, month: '2025-02-01', segment: sme, volume_eur: 0, revenue_eur: 0, economic_contribution_eur: -100}
          - {client_id: E, month: '2025-03-01', segment: sme, volume_eur: 1000000, revenue_eur: 300, economic_contribution_eur: 200}
    expect:
      format: dict
      rows:
        - {client_id: B, month: '2025-01-01', month_index: 0, gross_margin_bps: 3.5, economic_margin_bps: 3.0, contribution_rolling_3m_eur: null, trend_slope_eur_per_month: -100, trend_flag: deteriorating}
        - {client_id: B, month: '2025-02-01', month_index: 1, gross_margin_bps: 2.5, economic_margin_bps: 2.0, contribution_rolling_3m_eur: null, trend_slope_eur_per_month: -100, trend_flag: deteriorating}
        - {client_id: B, month: '2025-03-01', month_index: 2, gross_margin_bps: 1.5, economic_margin_bps: 1.0, contribution_rolling_3m_eur: 600, trend_slope_eur_per_month: -100, trend_flag: deteriorating}
        - {client_id: C, month: '2025-01-01', month_index: 0, gross_margin_bps: 1.5, economic_margin_bps: 1.0, contribution_rolling_3m_eur: null, trend_slope_eur_per_month: -0.5, trend_flag: stable}
        - {client_id: C, month: '2025-02-01', month_index: 1, gross_margin_bps: 1.51, economic_margin_bps: 1.01, contribution_rolling_3m_eur: null, trend_slope_eur_per_month: -0.5, trend_flag: stable}
        - {client_id: C, month: '2025-03-01', month_index: 2, gross_margin_bps: 1.49, economic_margin_bps: 0.99, contribution_rolling_3m_eur: 300, trend_slope_eur_per_month: -0.5, trend_flag: stable}
        - {client_id: D, month: '2025-03-01', month_index: 2, gross_margin_bps: 1.0, economic_margin_bps: 0.5, contribution_rolling_3m_eur: null, trend_slope_eur_per_month: null, trend_flag: stable}
        - {client_id: E, month: '2025-02-01', month_index: 1, gross_margin_bps: null, economic_margin_bps: null, contribution_rolling_3m_eur: null, trend_slope_eur_per_month: 300, trend_flag: improving}
        - {client_id: E, month: '2025-03-01', month_index: 2, gross_margin_bps: 3.0, economic_margin_bps: 2.0, contribution_rolling_3m_eur: null, trend_slope_eur_per_month: 300, trend_flag: improving}

  # Metric 11 on a window starting January 2025.
  #  sme EURUSD, six months with trades: Jan, Feb, Apr, May, Jun, Jul (March has none, so the
  #     month index skips 2: 0, 1, 3, 4, 5, 6). January has two trades, EUR 3m earning 2,700 and
  #     EUR 1m earning 1,300: Σ / Σ = 4,000 / 4,000,000 = 10 bps, where the average of the two
  #     trades' bps (9 and 13) would be 11. The monthly margins are 10, 9, 7, 6, 5, 4 = 10 minus
  #     the month index, so the slope is exactly -1 bp a month = -12 bps a year. A row-number index
  #     (0 to 5) would give a different slope, so this also pins the window-based index.
  #  hedge_fund EURUSD, six months at a flat 3 bps: slope 0. Same pair, different segment, so it
  #     is a separate regression.
  #  sme EURGBP, five months: below the six-month minimum, so it has no rows at all.
  #  compression_pct_per_year = slope / |mean monthly margin| x 100. sme EURUSD: the mean of
  #     10, 9, 7, 6, 5, 4 is 41 / 6 = 6.8333, so -12 / 6.8333 x 100 = -175.6098 (a steep toy
  #     decline). hedge_fund EURUSD: 0 / 3 = 0.
  #  payment_institution EURUSD, six months at exactly 0 bps: slope 0 and mean 0, so the
  #     percentage is NULL (nullif), not a division error.
  #  hedge_fund EURGBP, losing -1 to -6 bps: slope -12 and mean -3.5. Dividing by |mean| keeps
  #     the sign of the slope, so a widening loss reads as -342.8571, not as +342.8571.
  - name: mart_spread_compression_slope_and_minimum_months
    model: mart_spread_compression
    given:
      - input: ref('int_window')
        format: dict
        rows:
