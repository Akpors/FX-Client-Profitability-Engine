  # Metric 8 on a book of seven clients (metrics.md section 6.5).
  #  volume: the six clients that traded (G did not), 400 / 200 / 150 / 100 / 100 / 50 of 1,000.
  #     top 5 = 950 / 1,000 = 0.95, and with only six clients top 10 and top 20 are 1.
  #     HHI = 0.16 + 0.04 + 0.0225 + 0.01 + 0.01 + 0.0025 = 0.245.
  #  revenue: only A to D have positive revenue (E earned exactly 0, F lost money): 50 / 30 /
  #     20 / 10 of 110. HHI = (2,500 + 900 + 400 + 100) / 110^2 = 3,900 / 12,100 = 0.3223.
  #  contribution_positive: A, B and D (20 / 10 / 5 of 35). HHI = (400 + 100 + 25) / 35^2 = 0.4286.
  - name: mart_concentration_populations_and_hhi
    model: mart_concentration
    given:
      - input: ref('mart_client_profitability')
        format: dict
        rows:
          - {client_id: A, trade_count: 10, volume_eur: 400, revenue_eur: 50, economic_contribution_eur: 20}
          - {client_id: B, trade_count: 5, volume_eur: 200, revenue_eur: 30, economic_contribution_eur: 10}
          - {client_id: C, trade_count: 5, volume_eur: 150, revenue_eur: 20, economic_contribution_eur: -5}
          - {client_id: D, trade_count: 5, volume_eur: 100, revenue_eur: 10, economic_contribution_eur: 5}
          - {client_id: E, trade_count: 5, volume_eur: 100, revenue_eur: 0, economic_contribution_eur: -2}
          - {client_id: F, trade_count: 5, volume_eur: 50, revenue_eur: -10, economic_contribution_eur: -30}
          - {client_id: G, trade_count: 0, volume_eur: 0, revenue_eur: 0, economic_contribution_eur: -15}
    expect:
      format: dict
      rows:
        - {measure: volume, n_clients: 6, top5_share: 0.95, top10_share: 1, top20_share: 1, hhi: 0.245}
        - {measure: revenue, n_clients: 4, top5_share: 1, top10_share: 1, top20_share: 1, hhi: 0.3223}
        - {measure: contribution_positive, n_clients: 3, top5_share: 1, top10_share: 1, top20_share: 1, hhi: 0.4286}

  # Headline KPIs on three clients, one of which did not trade. The client count is the two that
  # traded; the contribution total still carries the idle client's coverage cost (-30).
  #   volume 1.5m, revenue 300 = 2 bps; contribution 150 - 20 - 30 = 100 = 0.6667 bps.
  # The hurdle rate is picked out of the parameters by name.
  - name: mart_headline_kpis_totals
    model: mart_headline_kpis
    given:
      - input: ref('mart_client_profitability')
        format: dict
        rows:
          - {client_id: A, trade_count: 10, volume_eur: 1000000, revenue_eur: 200, economic_contribution_eur: 150}
          - {client_id: B, trade_count: 5, volume_eur: 500000, revenue_eur: 100, economic_contribution_eur: -20}
          - {client_id: C, trade_count: 0, volume_eur: 0, revenue_eur: 0, economic_contribution_eur: -30}
      - input: ref('int_window')
        format: dict
        rows:
          - {window_start: '2025-01-01', window_end: '2025-03-31'}
      - input: ref('stg_parameters')
        format: dict
        rows:
          - {name: capital_charge_bps, value: 0.1}
          - {name: hurdle_rate_bps, value: 0.75}
    expect:
      format: dict
      rows:
        - {total_volume_eur: 1500000, total_revenue_eur: 300, total_contribution_eur: 100, gross_margin_bps: 2, economic_margin_bps: 0.6667, client_count: 2, trade_count: 15, window_start: '2025-01-01', window_end: '2025-03-31', hurdle_rate_bps: 0.75}
