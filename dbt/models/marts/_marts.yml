        - {segment: sme, currency_pair: EURUSD, month: '2025-06-01', month_index: 5, n_months: 6, volume_eur: 1000000, gross_margin_bps: 5, compression_slope_bps_per_year: -12, compression_pct_per_year: -175.6098}
